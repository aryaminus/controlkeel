name: Bump Version

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed

concurrency:
  group: bump-version-main
  cancel-in-progress: true

permissions:
  contents: write
  actions: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  bump:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      vars.CONTROLKEEL_RELEASE_AUTOTAG_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}
          token: ${{ github.token }}

      - name: Confirm successful CI commit is still current main
        env:
          VERIFIED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          git fetch origin main
          test "$(git rev-parse HEAD)" = "${VERIFIED_SHA}"
          test "$(git rev-parse origin/main)" = "${VERIFIED_SHA}"

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Ensure clean baseline
        run: |
          if git log -1 --pretty=%s | grep -q '^chore(release): bump version to '; then
            echo "Latest commit is already a release bump; exiting."
            exit 0
          fi

      - name: Bump patch version and changelog
        run: |
          python3 scripts/bump_version.py > /tmp/controlkeel-version.txt

      - name: Commit release bump
        run: |
          VERSION=$(cat /tmp/controlkeel-version.txt)
          git add mix.exs CHANGELOG.md packages/npm/controlkeel/package.json packages/npm/controlkeel/package-lock.json packages/npm/controlkeel/server.json plugin.json .cursor-plugin/plugin.json
          git commit -m "chore(release): bump version to ${VERSION}"
          git tag "v${VERSION}"

      - name: Push commit and tag
        env:
          VERIFIED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          VERSION=$(cat /tmp/controlkeel-version.txt)
          git fetch origin main
          test "$(git rev-parse origin/main)" = "${VERIFIED_SHA}"
          git push --force-with-lease="refs/heads/main:${VERIFIED_SHA}" origin HEAD:main
          git push origin "refs/tags/v${VERSION}"

      # Pushes made with GITHUB_TOKEN never trigger other workflows, so the
      # tag push above starts nothing on its own. workflow_dispatch is the one
      # event GITHUB_TOKEN may trigger: build the candidate on the tag, then
      # start the release, which waits for that smoke run to pass.
      - name: Start release smoke and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(cat /tmp/controlkeel-version.txt)
          gh workflow run release-smoke.yml --ref "v${VERSION}"
          gh workflow run release.yml --ref "v${VERSION}"
