name: Release
run-name: Release (${{ github.ref_name }} @ ${{ github.sha }})

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  prepare-release-candidate:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Find successful Release Smoke run for this SHA
        id: smoke_run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ATTEMPTS=30
          SLEEP_SECONDS=20
          RUN_ID=""

          for attempt in $(seq 1 "$ATTEMPTS"); do
            RUNS_JSON=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/release-smoke.yml/runs?branch=main&event=push&per_page=100")

            RUN_ID=$(echo "$RUNS_JSON" | jq -r --arg sha "$GITHUB_SHA" '.workflow_runs[] | select(.head_sha == $sha and .conclusion == "success") | .id' | head -n 1)
            if [ -n "$RUN_ID" ] && [ "$RUN_ID" != "null" ]; then
              echo "Found successful Release Smoke run: ${RUN_ID}"
              break
            fi

            STATUS=$(echo "$RUNS_JSON" | jq -r --arg sha "$GITHUB_SHA" '.workflow_runs[] | select(.head_sha == $sha) | .status' | head -n 1)
            CONCLUSION=$(echo "$RUNS_JSON" | jq -r --arg sha "$GITHUB_SHA" '.workflow_runs[] | select(.head_sha == $sha) | .conclusion' | head -n 1)

            if [ -n "$STATUS" ] && [ "$STATUS" != "null" ]; then
              echo "Attempt ${attempt}/${ATTEMPTS}: Release Smoke for ${GITHUB_SHA} status=${STATUS} conclusion=${CONCLUSION}"

              if [ "$STATUS" = "completed" ] && [ -n "$CONCLUSION" ] && [ "$CONCLUSION" != "null" ] && [ "$CONCLUSION" != "success" ]; then
                echo "Release Smoke for ${GITHUB_SHA} completed with conclusion=${CONCLUSION}; cannot publish this tag." >&2
                echo "Ensure Release Smoke succeeds for this SHA on main before publishing a tag." >&2
                exit 1
              fi
            else
              echo "Attempt ${attempt}/${ATTEMPTS}: No Release Smoke run found yet for ${GITHUB_SHA}."
            fi

            if [ "$attempt" -lt "$ATTEMPTS" ]; then
              sleep "$SLEEP_SECONDS"
            fi
          done

          if [ -z "$RUN_ID" ] || [ "$RUN_ID" = "null" ]; then
            echo "No successful Release Smoke run found for ${GITHUB_SHA} on main after waiting $((ATTEMPTS * SLEEP_SECONDS)) seconds." >&2
            echo "Run Release Smoke successfully for this SHA before publishing a tag." >&2
            exit 1
          fi

          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
      - name: Download release candidate artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ARTIFACT_NAME="release-candidate-dist-${GITHUB_SHA}"
          mkdir -p /tmp/release-candidate
          gh run download "${{ steps.smoke_run.outputs.run_id }}" -R "${GITHUB_REPOSITORY}" -n "$ARTIFACT_NAME" -D /tmp/release-candidate
          test -f /tmp/release-candidate/controlkeel-checksums.txt
      - uses: actions/upload-artifact@v4
        with:
          name: release-candidate-dist
          path: /tmp/release-candidate
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: release-metadata
          path: /tmp/release-candidate/controlkeel-checksums.txt
          retention-days: 1

  sign-release:
    needs: prepare-release-candidate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-candidate-dist
          path: dist
      - name: Install cosign
        uses: sigstore/cosign-installer@v3
      - name: Sign release binaries and checksums
        env:
          COSIGN_EXPERIMENTAL: true
        run: |
          # Keyless signing via GitHub OIDC identity — no secrets required.
          # Verifiers can check signatures with:
          #   cosign verify-blob <file> --certificate <file>.pem --signature <file>.sig \
          #     --certificate-identity-regexp '^https://github.com/aryaminus/controlkeel/.github/workflows/release.yml@refs/tags/v[0-9].*'  \
          #     --certificate-oidc-issuer https://token.actions.githubusercontent.com
          for f in dist/*; do
            if [ -f "$f" ]; then
              cosign sign-blob "$f" --output-signature "$f.sig" --output-certificate "$f.pem" --yes
            fi
          done
      - uses: actions/upload-artifact@v4
        with:
          name: release-signed-dist
          path: dist
          retention-days: 1

  release:
    needs: sign-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-signed-dist
          path: dist
      - name: Render release notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          python3 scripts/render_release_notes.py "$VERSION" > /tmp/controlkeel-release-notes.md
      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"

          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" dist/* --clobber
            gh release edit "${TAG}" \
              --title "${TAG}" \
              --notes-file /tmp/controlkeel-release-notes.md \
              --latest
          else
            gh release create "${TAG}" dist/* \
              --verify-tag \
              --title "${TAG}" \
              --notes-file /tmp/controlkeel-release-notes.md \
              --latest
          fi

  publish-homebrew:
    needs: [prepare-release-candidate, release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Check Homebrew publish configuration
        id: homebrew_gate
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "${HOMEBREW_TAP_TOKEN}" ]; then
            echo "HOMEBREW_TAP_TOKEN is not configured; skipping Homebrew publish."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@v4
        if: steps.homebrew_gate.outputs.enabled == 'true'
        with:
          name: release-metadata
          path: /tmp/release-metadata
      - name: Publish Homebrew formula
        if: steps.homebrew_gate.outputs.enabled == 'true'
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          BASE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"

          MAC_INTEL_SHA=$(awk '$2 ~ /(^|\/)controlkeel-macos-x86_64\.tar\.gz$/ {print $1; exit}' /tmp/release-metadata/controlkeel-checksums.txt)
          MAC_ARM_SHA=$(awk '$2 ~ /(^|\/)controlkeel-macos-arm64\.tar\.gz$/ {print $1; exit}' /tmp/release-metadata/controlkeel-checksums.txt)
          LINUX_SHA=$(awk '$2 ~ /(^|\/)controlkeel-linux-x86_64\.tar\.gz$/ {print $1; exit}' /tmp/release-metadata/controlkeel-checksums.txt)

          if [ -z "${MAC_INTEL_SHA}" ] || [ -z "${MAC_ARM_SHA}" ] || [ -z "${LINUX_SHA}" ]; then
            echo "Missing one or more Homebrew checksums; refusing to publish formula with empty sha256 values." >&2
            exit 1
          fi

          cat > /tmp/controlkeel.rb <<EOF
          class Controlkeel < Formula
            desc "Control plane for governed AI coding"
            homepage "https://github.com/${GITHUB_REPOSITORY}"
            version "${VERSION}"
            license "Apache-2.0"

            on_macos do
              if Hardware::CPU.arm?
                url "${BASE_URL}/controlkeel-macos-arm64.tar.gz"
                sha256 "${MAC_ARM_SHA}"
              else
                url "${BASE_URL}/controlkeel-macos-x86_64.tar.gz"
                sha256 "${MAC_INTEL_SHA}"
              end
            end

            on_linux do
              url "${BASE_URL}/controlkeel-linux-x86_64.tar.gz"
              sha256 "${LINUX_SHA}"
            end

            def install
              bin.install "controlkeel"
            end

            test do
              assert_match "ControlKeel", shell_output("#{bin}/controlkeel version")
            end
          end
          EOF

          git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/aryaminus/homebrew-controlkeel.git" /tmp/homebrew-controlkeel
          mkdir -p /tmp/homebrew-controlkeel/Formula
          cp /tmp/controlkeel.rb /tmp/homebrew-controlkeel/Formula/controlkeel.rb
          cd /tmp/homebrew-controlkeel
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/controlkeel.rb
          git diff --cached --quiet && exit 0
          git commit -m "chore(release): update controlkeel ${VERSION}"
          git push

  publish-npm:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Use npm Trusted Publishing
        run: echo "Publishing npm packages with GitHub OIDC trusted publishing."
      - name: Publish npm bootstrap package
        working-directory: packages/npm/controlkeel
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          PACKAGE_VERSION=$(node -p "require('./package.json').version")

          if [ "${PACKAGE_VERSION}" != "${VERSION}" ]; then
            echo "Refusing to publish ${PACKAGE_NAME}@${PACKAGE_VERSION} for tag v${VERSION}." >&2
            exit 1
          fi

          if npm view "${PACKAGE_NAME}@${PACKAGE_VERSION}" --registry=https://registry.npmjs.org version >/dev/null 2>&1; then
            echo "${PACKAGE_NAME}@${PACKAGE_VERSION} already exists on npm; skipping publish."
            exit 0
          fi

          npm publish --access public --provenance --registry=https://registry.npmjs.org
      - uses: actions/download-artifact@v4
        with:
          name: release-candidate-dist
          path: dist
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.19.5"
          otp-version: "27.3.4.3"
      - name: Publish OpenCode adapter package
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mix deps.get
          mix run scripts/export_release_bundles.exs

          PACKAGE_NAME=$(node -p "require('./controlkeel/dist/opencode-native/package.json').name")
          PACKAGE_VERSION=$(node -p "require('./controlkeel/dist/opencode-native/package.json').version")

          if [ "${PACKAGE_VERSION}" != "${VERSION}" ]; then
            echo "Refusing to publish ${PACKAGE_NAME}@${PACKAGE_VERSION} for tag v${VERSION}." >&2
            exit 1
          fi

          if npm view "${PACKAGE_NAME}@${PACKAGE_VERSION}" --registry=https://registry.npmjs.org version >/dev/null 2>&1; then
            echo "${PACKAGE_NAME}@${PACKAGE_VERSION} already exists on npm; skipping publish."
            exit 0
          fi

          npm publish controlkeel/dist/opencode-native --access public --provenance --registry=https://registry.npmjs.org
      - name: Publish Pi adapter package
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mix deps.get
          mix run scripts/export_release_bundles.exs

          PACKAGE_NAME=$(node -p "require('./controlkeel/dist/pi-native/package.json').name")
          PACKAGE_VERSION=$(node -p "require('./controlkeel/dist/pi-native/package.json').version")

          if [ "${PACKAGE_VERSION}" != "${VERSION}" ]; then
            echo "Refusing to publish ${PACKAGE_NAME}@${PACKAGE_VERSION} for tag v${VERSION}." >&2
            exit 1
          fi

          if npm view "${PACKAGE_NAME}@${PACKAGE_VERSION}" --registry=https://registry.npmjs.org version >/dev/null 2>&1; then
            echo "${PACKAGE_NAME}@${PACKAGE_VERSION} already exists on npm; skipping publish."
            exit 0
          fi

          npm publish controlkeel/dist/pi-native --access public --provenance --registry=https://registry.npmjs.org

  publish-github-packages:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          scope: "@aryaminus"
      - name: Publish GitHub Packages bootstrap package
        working-directory: packages/npm/controlkeel
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          PACKAGE_VERSION=$(node -p "require('./package.json').version")

          if [ "${PACKAGE_VERSION}" != "${VERSION}" ]; then
            echo "Refusing to publish ${PACKAGE_NAME}@${PACKAGE_VERSION} for tag v${VERSION}." >&2
            exit 1
          fi

          if npm view "${PACKAGE_NAME}@${PACKAGE_VERSION}" --registry=https://npm.pkg.github.com version >/dev/null 2>&1; then
            echo "${PACKAGE_NAME}@${PACKAGE_VERSION} already exists on GitHub Packages; skipping publish."
            exit 0
          fi

          npm publish --registry=https://npm.pkg.github.com

  publish-vscode-marketplace:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-candidate-dist
          path: dist
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check VS Code marketplace publish configuration
        id: vscode_gate
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "${VSCE_PAT}" ]; then
            echo "VSCE_PAT is not configured; skipping VS Code marketplace publish."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish VS Code companion
        if: steps.vscode_gate.outputs.enabled == 'true'
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          npx --yes @vscode/vsce publish --packagePath dist/controlkeel-vscode-companion.vsix -p "${VSCE_PAT}"

  verify-channels:
    needs: [release, publish-npm, publish-github-packages]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify publish channels
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          TAG="${GITHUB_REF_NAME}"
          NPM_NAME=$(node -p "require('./packages/npm/controlkeel/package.json').name")

          echo "=== Channel verification for ${TAG} ==="

          FAIL=0

          if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "PASS  GitHub Release ${TAG}"
          else
            echo "FAIL  GitHub Release ${TAG} not found"
            FAIL=1
          fi

          if npm view "${NPM_NAME}@${VERSION}" --registry=https://registry.npmjs.org version >/dev/null 2>&1; then
            echo "PASS  npm ${NPM_NAME}@${VERSION}"
          else
            echo "FAIL  npm ${NPM_NAME}@${VERSION} not found"
            FAIL=1
          fi

          if npm view "${NPM_NAME}@${VERSION}" --registry=https://npm.pkg.github.com version >/dev/null 2>&1; then
            echo "PASS  GitHub Packages ${NPM_NAME}@${VERSION}"
          else
            echo "FAIL  GitHub Packages ${NPM_NAME}@${VERSION} not found"
            FAIL=1
          fi

          if gh api repos/aryaminus/homebrew-controlkeel/contents/Formula/controlkeel.rb >/dev/null 2>&1; then
            echo "OK    Homebrew formula present (optional channel)"
          else
            echo "SKIP  Homebrew formula not found (optional channel, skipped)"
          fi

          echo "SKIP  VS Code marketplace (optional channel, only publishes when VSCE_PAT configured)"

          echo "=== Summary ==="
          if [ "$FAIL" -ne 0 ]; then
            echo "One or more required channels are missing for ${TAG}."
            exit 1
          fi
          echo "All required channels verified for ${TAG}."
