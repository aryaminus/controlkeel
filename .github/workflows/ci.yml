name: CI

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/*.md"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  test:
    if: >-
      github.event_name != 'push' ||
      !startsWith(github.event.head_commit.message || '', 'chore(release): bump version to ')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.19.5"
          otp-version: "27.3.4.3"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Cache deps
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
            ~/.hex
            ~/.mix
          key: ${{ runner.os }}-mix-${{ hashFiles('mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-
      - run: sh scripts/verify_ci_workflow.sh
      - run: mix deps.get
      - run: mix compile
      - name: Install ripgrep
        run: sudo apt-get install -y ripgrep
      - name: Run tests
        run: mix test
        timeout-minutes: 30
      - run: sh -n scripts/install.sh
      - run: python3 -m py_compile scripts/bump_version.py scripts/render_release_notes.py
      - run: node --check packages/npm/controlkeel/bin/controlkeel.js
      - run: node --check packages/npm/controlkeel/lib/install.js
      - run: cd packages/npm/controlkeel-sdk && npm install && npm run build && node --check dist/index.js
      - name: SDK integration tests
        run: cd packages/npm/controlkeel-sdk && npm test
  test-postgres:
    if: >-
      github.event_name != 'push' ||
      !startsWith(github.event.head_commit.message || '', 'chore(release): bump version to ')
    needs: [test]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MIX_ENV: test
      CK_DB_ADAPTER: postgres
      DATABASE_URL: postgres://controlkeel_test:controlkeel_test@localhost:5432/controlkeel_test
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: controlkeel_test
          POSTGRES_PASSWORD: controlkeel_test
          POSTGRES_DB: controlkeel_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.19.5"
          otp-version: "27.3.4.3"
      - name: Cache deps
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
            ~/.hex
            ~/.mix
          key: ${{ runner.os }}-mix-pg-${{ hashFiles('mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-pg-
      - run: mix deps.get
      - run: mix compile --warnings-as-errors
      - run: mix ecto.create
      - run: mix ecto.migrate
      - name: Run tests against Postgres
        run: mix test
        timeout-minutes: 30

  self-host-smoke:
    if: >-
      github.event_name != 'push' ||
      !startsWith(github.event.head_commit.message || '', 'chore(release): bump version to ')
    needs: [test]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MIX_ENV: dev
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.19.5"
          otp-version: "27.3.4.3"
      - name: Cache deps
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
            ~/.hex
            ~/.mix
          key: ${{ runner.os }}-mix-${{ hashFiles('mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-
      - run: mix deps.get
      - run: chmod +x scripts/self_host_smoke.sh
      - name: Run self-host smoke
        run: scripts/self_host_smoke.sh

  docker-base:
    # Validates the Dockerfile base images without the expensive from-source OTP
    # build: fully builds the agent-runner image and verifies the main
    # Dockerfile's apt package sets resolve on its base image. Catches base-image
    # bumps (e.g. bookworm -> trixie) that rename/drop packages.
    if: >-
      github.event_name != 'push' ||
      !startsWith(github.event.head_commit.message || '', 'chore(release): bump version to ')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build agent-runner image
        run: docker build -f Dockerfile.agent-runner -t controlkeel-agent-runner:ci .
      - name: Verify main Dockerfile apt package sets resolve on their base images
        run: |
          set -euo pipefail
          build_base="$(awk '/^FROM/{print $2; exit}' Dockerfile)"
          runtime_base="$(awk '/^FROM/ && seen++ {print $2; exit}' Dockerfile)"
          echo "Build base: $build_base"
          echo "Runtime base: $runtime_base"
          docker run --rm "$build_base" bash -c '
            set -eux
            apt-get update
            apt-get install -y --no-install-recommends \
              build-essential ca-certificates curl git wget unzip libssl-dev libncurses-dev
          '
          docker run --rm "$runtime_base" bash -c '
            set -eux
            apt-get update
            apt-get install -y --no-install-recommends \
              libstdc++6 libssl3t64 ca-certificates libncurses6 git
          '
